<!DOCTYPE html>
<html lang="en">
<head>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-WM3KEDD127"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-WM3KEDD127');</script>

  <meta charset="UTF-8">
  <title>Movie – SmTv Urdu</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800;900&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{background:#07090f;color:#e2ecf8;font-family:'Inter','Segoe UI',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100dvh;}
    a{text-decoration:none;color:inherit;}
    img,video{display:block;max-width:100%;}
    button{font-family:inherit;cursor:pointer;border:none;background:none;}
    #main-content{max-width:980px;margin:0 auto;padding:12px 12px 0;}
    @media(max-width:600px){body{padding-bottom:calc(114px + env(safe-area-inset-bottom));}}

    @keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
    @keyframes shine{0%{background-position:-400px 0}100%{background-position:400px 0}}
    @keyframes borderSpin{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
    @keyframes crownBob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-4px) rotate(4deg)}}
    @keyframes goldPulse{0%,100%{box-shadow:0 4px 18px rgba(255,185,0,.28),inset 0 1px 0 rgba(255,255,255,.2)}50%{box-shadow:0 8px 28px rgba(255,185,0,.45),inset 0 1px 0 rgba(255,255,255,.2)}}
    @keyframes dotPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.15;transform:scale(.5)}}

    .movie-header{position:relative;border-radius:20px;overflow:hidden;background:#0d1220;border:1px solid rgba(255,255,255,.07);box-shadow:0 20px 60px rgba(0,0,0,.6);margin-bottom:20px;animation:fadeUp .6s cubic-bezier(.22,.8,.2,1) both;}
    .movie-poster{width:100%;height:220px;object-fit:cover;object-position:center top;display:block;background:#0a0e1a;}
    .movie-poster-fade{position:absolute;left:0;right:0;bottom:0;height:90px;background:linear-gradient(to bottom,transparent,#0d1220);pointer-events:none;z-index:2;}
    .movie-meta{position:relative;z-index:3;padding:8px 16px 18px;text-align:center;}
    .movie-back-btn{position:absolute;left:12px;top:12px;z-index:10;width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;border-radius:10px;background:rgba(7,9,15,.82);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(12px);color:#a0bcd8;font-size:15px;transition:background .2s,border-color .2s,transform .2s;box-shadow:0 4px 14px rgba(0,0,0,.45);}
    .movie-back-btn:hover{background:rgba(0,195,225,.12);border-color:rgba(0,195,225,.35);transform:translateX(-2px);}
    .movie-title{font-family:'Cinzel',serif;font-size:clamp(1.15rem,4vw,1.65rem);font-weight:800;letter-spacing:.05em;color:#fff;text-shadow:0 2px 20px rgba(0,0,0,.6);margin:0 0 8px;line-height:1.2;}
    .movie-desc{font-size:.84rem;color:#7090a8;line-height:1.65;max-width:560px;margin:0 auto 14px;}

    .smtv-vip-card{position:relative;max-width:360px;margin:0 auto 4px;padding:1.5px;border-radius:16px;background:linear-gradient(270deg,#00d0ee,#ffc83a,#00d0ee);background-size:300% 300%;animation:borderSpin 4s ease infinite, fadeUp .65s cubic-bezier(.22,.8,.2,1) .08s both;}
    .smtv-vip-inner{background:linear-gradient(160deg,#0c1a2e,#080f1d);border-radius:15px;padding:14px 13px 15px;position:relative;overflow:hidden;}
    .smtv-vip-title{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
    .smtv-vip-crown{font-size:1rem;flex-shrink:0;animation:crownBob 2.2s ease-in-out infinite;display:inline-block;}
    .smtv-vip-title-text{font-size:.9rem;font-weight:900;letter-spacing:.01em;background:linear-gradient(90deg,#ffd84a,#ffee99,#ffd84a);background-size:200% auto;animation:shine 2.6s linear infinite;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
    .smtv-vip-feats{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:13px;}
    .smtv-vip-feat{display:flex;align-items:center;gap:6px;padding:8px 9px;border-radius:9px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);position:relative;overflow:hidden;}
    .smtv-vip-feat::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2.5px;border-radius:9px 0 0 9px;}
    .smtv-vip-feat:nth-child(1)::before{background:#ff7a5a;}
    .smtv-vip-feat:nth-child(2)::before{background:#1de8ff;}
    .smtv-vip-feat:nth-child(3)::before{background:#a78bfa;}
    .smtv-vip-feat:nth-child(4)::before{background:#ffd84a;}
    .smtv-vip-feat-icon{font-size:.78rem;flex-shrink:0;line-height:1;width:16px;text-align:center;}
    .smtv-vip-feat-label{font-size:.68rem;font-weight:700;color:#d0e8ff;white-space:nowrap;line-height:1.2;min-width:0;letter-spacing:-.01em;}
    .smtv-vip-btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:11px 14px;border-radius:10px;font-size:.84rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#1a0500;text-decoration:none;position:relative;overflow:hidden;background:linear-gradient(135deg,#ffc83a,#ffde70,#ffb020);box-shadow:0 8px 22px rgba(255,185,0,.28),inset 0 1px 0 rgba(255,255,255,.28);transition:transform .2s,box-shadow .2s;animation:goldPulse 2.8s ease-in-out infinite;border:none;cursor:pointer;}
    .smtv-vip-btn:hover{transform:translateY(-2px);}

    .movie-watch-now-btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;max-width:360px;margin:20px auto;padding:15px 18px;border-radius:14px;font-size:.96rem;font-weight:900;letter-spacing:.05em;text-transform:uppercase;color:#021820;background:linear-gradient(135deg,#1de8ff,#00a8d0);box-shadow:0 10px 28px rgba(0,200,235,.35);transition:transform .2s,box-shadow .2s;border:none;cursor:pointer;}
    .movie-watch-now-btn:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(0,200,235,.45);}
    .movie-watch-now-btn:active{transform:scale(.97);}

    .howto-section{margin:24px 0 20px;scroll-margin-top:20px;}
    .pro-tutorial-title{display:flex;align-items:center;gap:11px;padding-bottom:10px;border-bottom:1.5px solid rgba(0,205,235,.3);margin-bottom:0;}
    .pro-tutorial-title .smtv-bar{width:4px;height:26px;border-radius:3px;flex-shrink:0;background:#1de8ff;box-shadow:0 0 12px rgba(0,205,235,.6);}
    .pro-tutorial-title .smtv-howto-text{font-family:'Cinzel',serif;font-size:1.15rem;font-weight:800;font-style:italic;color:#fff;line-height:1.25;letter-spacing:.01em;}
    .pro-video-frame-wrap{position:relative;width:100%;height:0;padding-bottom:56.25%;overflow:hidden;border-radius:13px;background:#080c18;border:1px solid rgba(255,255,255,.06);box-shadow:0 10px 28px rgba(0,0,0,.45);}
    .pro-video-frame-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:#000;}

    .adblock-guide-btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;margin:14px 0;padding:10px 14px;border-radius:10px;background:rgba(0,205,235,.08);border:1px solid rgba(0,205,235,.3);color:#1de8ff;font-size:.78rem;font-weight:800;letter-spacing:.02em;transition:background .2s,border-color .2s;}
    .adblock-guide-btn:hover,.adblock-guide-btn.active{background:rgba(0,205,235,.18);border-color:rgba(0,205,235,.5);}
    .adblock-frame-wrap{margin-bottom:14px;}

    .movie-loading,.movie-error{color:#fff;padding:40px 20px;text-align:center;}
  </style>

</head>
<body>

<div id="main-content">
  <div id="movie-details">
    <div class="movie-loading">Loading movie...</div>
  </div>
</div>

<div id="footer-placeholder"></div>

<script>
(function () {
  'use strict';

  const HOWTO_PROCESS_1 = `<iframe class="rumble" width="640" height="360" src="https://rumble.com/embed/v6yg45g/?pub=4ni0h4" frameborder="0" allowfullscreen></iframe>`;
  const HOWTO_PROCESS_2 = `<iframe class="rumble" width="640" height="360" src="https://rumble.com/embed/v6yg466/?pub=4ni0h4" frameborder="0" allowfullscreen></iframe>`;
  const HOWTO_ADBLOCK   = `<iframe class="rumble" width="640" height="360" src="https://rumble.com/embed/v7cji0k/?pub=4qdqa6" frameborder="0" allowfullscreen></iframe>`;

  function escapeHtml(s) {
    if (s === null || s === undefined) return '';
    return String(s).replace(/[&<>"'`=/]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','/':'&#x2F;','`':'&#x60;','=':'&#x3D;' }[c]));
  }

  let featureConfig = null;
  async function loadFeatureConfig() {
    try {
      const r = await fetch('/config.json', { cache: 'no-cache' });
      featureConfig = r.ok ? (await r.json()).redirectionFeatures : { shortlink:false, sponsorPopup:true };
    } catch (e) {
      featureConfig = { shortlink:false, sponsorPopup:true };
    }
  }

  (async function init() {
    await loadFeatureConfig();

    const qs = new URLSearchParams(location.search);
    const movieSlug = (qs.get('movie') || '').trim();
    const detailsEl = document.getElementById('movie-details');

    if (!movieSlug) {
      detailsEl.innerHTML = `<div class="movie-error">No movie selected.</div>`;
      return;
    }

    let movies;
    try {
      const r = await fetch('/movies.json', { cache:'no-cache' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      movies = await r.json();
    } catch (e) {
      detailsEl.innerHTML = `<div class="movie-error">Could not load movie list. Try again later.</div>`;
      return;
    }

    const movie = Array.isArray(movies) ? movies.find(m => m.slug === movieSlug) : null;
    if (!movie) {
      detailsEl.innerHTML = `<div class="movie-error">Movie not found.</div>`;
      return;
    }

    let movieShortlink = null;
    try {
      const dr = await fetch(`/movie-data/${movieSlug}.json`, { cache:'no-cache' });
      if (dr.ok) {
        const data = await dr.json();
        const entry = Array.isArray(data) ? data[0] : null;
        if (entry && entry.shortlink) movieShortlink = entry.shortlink;
      }
    } catch (e) { /* no playback data yet — Watch Now will fall through to episode.html */ }

    document.title = `${movie.title} – SmTv Urdu`;

    detailsEl.innerHTML = `
      <section class="movie-header">
        <a href="/movies.html" class="movie-back-btn" title="Back" aria-label="Back">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><polyline points="12 4 6 10 12 16" fill="none" stroke="#23c6ed" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></polyline></svg>
        </a>
        <img class="movie-poster" src="${escapeHtml(movie.poster || '')}" alt="${escapeHtml(movie.title || '')}">
        <div class="movie-poster-fade"></div>
        <div class="movie-meta">
          <h1 class="movie-title">${escapeHtml(movie.title || '')}</h1>
          <div class="movie-desc">${escapeHtml(movie.desc || '')}</div>

          <div class="smtv-vip-card">
            <div class="smtv-vip-inner">
              <div class="smtv-vip-title">
                <span class="smtv-vip-crown">👑</span>
                <span class="smtv-vip-title-text">SMTV VIP Membership</span>
              </div>
              <div class="smtv-vip-feats">
                <div class="smtv-vip-feat"><span class="smtv-vip-feat-icon">⚡</span><span class="smtv-vip-feat-label">No Ads</span></div>
                <div class="smtv-vip-feat"><span class="smtv-vip-feat-icon">⬇️</span><span class="smtv-vip-feat-label">Fast Download</span></div>
                <div class="smtv-vip-feat"><span class="smtv-vip-feat-icon">🔒</span><span class="smtv-vip-feat-label">Early Access</span></div>
                <div class="smtv-vip-feat"><span class="smtv-vip-feat-icon">🎞️</span><span class="smtv-vip-feat-label">HD Quality</span></div>
              </div>
              <a class="smtv-vip-btn" href="/premium.html"><i class="fa-solid fa-crown"></i> BECOME VIP</a>
            </div>
          </div>
        </div>
      </section>

      <button type="button" class="movie-watch-now-btn" id="watchNowBtn">
        <i class="fa-solid fa-play"></i> WATCH NOW
      </button>

      <div class="howto-section" id="how-to-watch">
        <div class="pro-tutorial-title"><span class="smtv-bar"></span><span class="smtv-howto-text">How to Watch</span></div>
        <div class="pro-video-frame-wrap">${HOWTO_PROCESS_1}</div>

        <button type="button" class="adblock-guide-btn" id="adblockGuideBtn">🛡️ Ads Not Skipping? Watch Adblocker Fix</button>
        <div class="pro-video-frame-wrap adblock-frame-wrap" id="adblockFrameWrap" style="display:none;">${HOWTO_ADBLOCK}</div>

        <div style="height:14px"></div>
        <div class="pro-tutorial-title" style="margin-top:12px;"><span class="smtv-bar"></span><span class="smtv-howto-text">How to Watch (Old Process)</span></div>
        <div class="pro-video-frame-wrap">${HOWTO_PROCESS_2}</div>
      </div>
    `;

    const adblockBtn = document.getElementById('adblockGuideBtn');
    const adblockFrame = document.getElementById('adblockFrameWrap');
    if (adblockBtn && adblockFrame) {
      adblockBtn.addEventListener('click', function () {
        const isOpen = adblockFrame.style.display !== 'none';
        adblockFrame.style.display = isOpen ? 'none' : 'block';
        adblockBtn.classList.toggle('active', !isOpen);
        if (!isOpen) adblockFrame.scrollIntoView({ behavior:'smooth', block:'nearest' });
      });
    }

    const watchNowBtn = document.getElementById('watchNowBtn');
    if (watchNowBtn) {
      watchNowBtn.addEventListener('click', function () {
        if (typeof gtag !== 'undefined') {
          gtag('event', 'movie_watch_click', { 'movie': movieSlug });
        }
        if (featureConfig && featureConfig.shortlink && !featureConfig.sponsorPopup && movieShortlink) {
          window.location.href = movieShortlink;
        } else {
          window.location.href = `episode.html?movie=${encodeURIComponent(movieSlug)}`;
        }
      });
    }
  })();
})();
</script>

<script>
(async function loadFooterRobust(){
  const candidates = ['/includes/footer.html','includes/footer.html','./includes/footer.html','/footer.html','footer.html'];
  const placeholder = document.getElementById('footer-placeholder');
  function initNav(html) {
    try {
      placeholder.innerHTML = html;
      try{const p=parseInt(getComputedStyle(document.body).paddingBottom)||0;if(p<96)document.body.style.paddingBottom='calc(96px + env(safe-area-inset-bottom))';}catch(e){}
      const nav = placeholder.querySelector('#smtv-bottom-nav')||placeholder.querySelector('.smtv-bottom-nav');
      if(!nav) return;
      const items = Array.from(nav.querySelectorAll('.nav-item'));
      items.forEach(i=>i.classList.remove('active'));
      const mi = items.find(i=>((i.dataset&&(i.dataset.name||'').toLowerCase())==='movies'));
      if(mi) mi.classList.add('active');
      items.forEach(a=>{
        if(a._si) return; a._si=true;
        a.addEventListener('click',function(e){try{e.preventDefault&&e.preventDefault();}catch(x){}items.forEach(i=>i.classList.remove('active'));this.classList.add('active');const h=this.getAttribute('href');if(h)location.assign(h);},{passive:false});
      });
    } catch(e){console.warn('initNav',e);}
  }
  for(const cand of candidates){
    try{const r=await fetch(cand,{cache:'no-cache'});if(!r.ok)continue;const t=await r.text();initNav(t);return;}catch(e){continue;}
  }
})();
</script>

</body>
</html>
